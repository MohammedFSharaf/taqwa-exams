name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.taqwa --project-name taqwa_exams .
          rm -rf test
          # Android settings: minSdk 23, newer Kotlin/AGP/Gradle for Firebase
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.1.4"/' android/settings.gradle
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          # App name and internet permission
          sed -i 's/android:label="[^"]*"/android:label="اختبارات التقوى"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          cat android/settings.gradle android/app/build.gradle

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: taqwa-exams-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
