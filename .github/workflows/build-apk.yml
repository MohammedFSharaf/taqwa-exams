name: Build APK

# push to main      -> Shorebird patch (silent update for installed apps)
# Run workflow + release -> full new APK (needed after native/plugin changes, or the first time)

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = new APK, patch = silent update'
        type: choice
        options: [patch, release]
        default: patch

permissions:
  contents: write

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  KS_PASS: ${{ secrets.KS_PASS }}
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.taqwa --project-name taqwa_exams .
          rm -rf test
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.1.4"/' android/settings.gradle
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          M=android/app/src/main/AndroidManifest.xml
          cp -r branding/res/. android/app/src/main/res/
          # Fixed signing key so updates install over the old app
          cp branding/upload.jks android/app/upload.jks
          python3 - <<'PY'
          p='android/app/build.gradle'; s=open(p).read()
          block = '''    signingConfigs {
                  release {
                      storeFile file("upload.jks")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "taqwa"
                      keyPassword System.getenv("KS_PASS")
                  }
              }

              buildTypes {'''
          s = s.replace('    buildTypes {', block, 1)
          s = s.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          # Compressed native libs: much smaller APK to download
          s = s.replace('android {', 'android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n', 1)
          # البصمة (local_auth): مكتبة AppCompat
          s += '\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n}\n'
          open(p,'w').write(s)
          PY
          grep -n "signingConfig\|useLegacyPackaging" android/app/build.gradle
          sed -i 's/android:label="[^"]*"/android:label="مركز التقوى"/' $M
          # البصمة: FragmentActivity + صلاحية + ثيم AppCompat
          find android/app/src/main -name MainActivity.kt -exec sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/; s/: FlutterActivity()/: FlutterFragmentActivity()/' {} +
          find android/app/src/main -name MainActivity.kt -exec cat {} +
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' $M
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            [ -f $f ] || continue
            sed -i 's#@android:style/Theme.Light.NoTitleBar#Theme.AppCompat.Light.NoActionBar#g; s#@android:style/Theme.Black.NoTitleBar#Theme.AppCompat.NoActionBar#g' $f
            cat $f
          done
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application#' $M

      - name: Shorebird app setup (first time only)
        id: init
        run: |
          if [ -f shorebird.yaml ]; then echo "created=false" >> $GITHUB_OUTPUT; exit 0; fi
          shorebird init --force --display-name "Taqwa Exams" || shorebird init --force
          cat shorebird.yaml
          grep -q "shorebird.yaml" pubspec.yaml || printf "  assets:\n    - shorebird.yaml\n" >> pubspec.yaml
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE=patch
          [ "${{ steps.init.outputs.created }}" = "true" ] && MODE=release
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          VNAME=$(echo "$VERSION" | sed 's/+.*//; s/\.0$//')
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Mode: $MODE  Build: $BUILD"

      - name: Shorebird release (new APK)
        if: steps.mode.outputs.mode == 'release'
        run: shorebird release android --flutter-version=${{ env.FLUTTER_VERSION }} --artifact=apk --target-platform=android-arm,android-arm64 --no-confirm

      - name: Shorebird patch (silent update)
        if: steps.mode.outputs.mode == 'patch'
        run: shorebird patch android --release-version=${{ steps.mode.outputs.version }} --no-confirm

      - name: Save Shorebird config to repo
        if: steps.init.outputs.created == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/shorebird.yaml app/pubspec.yaml
          git commit -m "Add Shorebird config"
          git push

      - name: Publish APK as GitHub release
        if: steps.mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.mode.outputs.build }}
          name: مركز التقوى — الإصدار ${{ steps.mode.outputs.vname }}${{ steps.mode.outputs.vname == '1.0' && ' (الإصدار الأول)' || '' }}
          body: |
            تطبيق مركز التقوى لتعليم وتحفيظ القرآن الكريم — الاختبارات والتسميع اليومي.
            نزّل ملف app-release.apk بالأسفل وثبّته (يُثبَّت فوق النسخة القديمة دون فقدان البيانات).
          make_latest: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
